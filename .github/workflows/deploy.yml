name: Deploy AppTiempos
on:
  push:
    branches: [dev]

concurrency:
  group: deploy-apptiempos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/fabrizio/apptiempos
    steps:
      - name: Sincronizar con origin/dev
        id: sync
        run: |
          git fetch origin dev
          git reset --hard origin/dev
          git merge-base --is-ancestor ${{ github.sha }} HEAD

      - name: Build web
        id: build_web
        if: steps.sync.outcome == 'success'
        run: |
          docker compose build web

      - name: Build api
        id: build_api
        if: steps.build_web.outcome == 'success'
        run: |
          docker compose build api

      - name: Desplegar Api & Web
        id: deploy-apiweb
        if: steps.build_api.outcome == 'success'
        run: docker compose up -d --wait --wait-timeout 120 api web

      - name: Logs de los servicios  (solo si falló el despliegue)
        if: failure() && steps.deploy-apiweb.outcome == 'failure'
        run: docker compose logs --tail=50

      - name: Notificar
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"Deploy AppTiempos: ${{ job.status }} (${GITHUB_SHA::7})\"}" \
            "$WEBHOOK"
