name: Deploy AppTiempos
on:
  push:
    branches: [dev]

concurrency:
  group: deploy-apptiempos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/fabrizio/apptiempos
    steps:
      - name: Subir memoria del LXC
        id: mem_up
        run: ssh -i ~/.ssh/pve_deploy -o BatchMode=yes root@192.168.0.2 up
      - name: Sincronizar con origin/dev
        id: sync
        if: steps.mem_up.outcome == 'success'
        run: |
          git fetch origin dev
          git reset --hard origin/dev
          git merge-base --is-ancestor ${{ github.sha }} HEAD

      - name: Build web
        id: build_web
        if: steps.sync.outcome == 'success'
        run: |
          docker compose build web

      - name: Build api
        id: build_api
        if: steps.build_web.outcome == 'success'
        run: |
          docker compose build api

      - name: Desplegar Api & Web
        id: deploy-apiweb
        if: steps.build_api.outcome == 'success'
        run: docker compose up -d --wait --wait-timeout 120 api web

      - name: Logs de los servicios  (solo si falló el despliegue)
        if: failure() && steps.deploy-apiweb.outcome == 'failure'
        run: docker compose logs --tail=50

      - name: Restaurar memoria del LXC
        if: steps.deploy-apiweb.outcome == 'success'
        run: ssh -i ~/.ssh/pve_deploy -o BatchMode=yes root@192.168.0.2 down

      - name: Notificar
        if: always()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          case "$STATUS" in
            success) EMOJI="✅"; TITLE="Deploy exitoso";   COLOR=5763719  ;;
            failure) EMOJI="❌"; TITLE="Deploy fallido";   COLOR=15548997 ;;
            *)       EMOJI="⚠️"; TITLE="Deploy cancelado"; COLOR=9807270  ;;
          esac

          MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-200)
          MSG=${MSG:-"(sin mensaje)"}

          jq -n \
            --arg title "$EMOJI $TITLE — AppTiempos" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg sha "${SHA::7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg actor "$ACTOR" \
            --arg msg "$MSG" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds:[{
              title: $title, url: $url, color: $color,
              fields: [
                {name:"Rama",    value:("`"+$branch+"`"), inline:true},
                {name:"Commit",  value:("[`"+$sha+"`]("+$commit_url+")"), inline:true},
                {name:"Autor",   value:$actor, inline:true},
                {name:"Mensaje", value:$msg}
              ],
              footer: {text:"GitHub Actions · srv-apptiempos"},
              timestamp: $ts
            }]}' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
